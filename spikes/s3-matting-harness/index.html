<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S3 Matting Harness (spike)</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #e8e8e8;
        background: #1a1a1f;
      }
      body {
        margin: 0;
        padding: 1rem 1.25rem 2rem;
        max-width: 1100px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }
      .banner {
        background: #2d2a1a;
        border: 1px solid #6b5a2a;
        padding: 0.6rem 0.75rem;
        border-radius: 6px;
        font-size: 0.85rem;
        margin-bottom: 1rem;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.8rem;
        color: #aaa;
      }
      select,
      button {
        font-size: 0.9rem;
        padding: 0.35rem 0.6rem;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .stage {
        position: relative;
        display: inline-block;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        max-width: 100%;
      }
      video,
      canvas {
        display: block;
        max-width: 100%;
        vertical-align: top;
      }
      #previewCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #rawVideo {
        visibility: hidden;
        width: 1px;
        height: 1px;
        position: absolute;
      }
      .overlay {
        position: absolute;
        top: 8px;
        left: 8px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        line-height: 1.45;
        background: rgba(0, 0, 0, 0.72);
        padding: 8px 10px;
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
      }
      .fallback-on .overlay {
        border: 2px solid #e6a700;
      }
      .status {
        margin-top: 0.75rem;
        font-size: 0.85rem;
        color: #9ab;
      }
      .err {
        color: #f88;
      }
    </style>
  </head>
  <body>
    <h1>S3 — Harness détourage (spike PREP)</h1>
    <p class="banner">
      Spike uniquement — pas de publish SFU. Mesures à reporter dans
      <code>spikes/S3-matting.md</code> après inventaire machines + go.
    </p>

    <div class="controls">
      <label>
        Résolution
        <select id="resolution">
          <option value="720">1280×720</option>
          <option value="1080">1920×1080</option>
        </select>
      </label>
      <label>
        Caméra
        <select id="cameraSelect">
          <option value="">—</option>
        </select>
      </label>
      <label>
        Backend
        <select id="backend">
          <option value="mock">Mock (alpha simulé)</option>
          <option value="mediapipe">MediaPipe (selfie, CDN)</option>
          <option value="webgpu">WebGPU (stub)</option>
          <option value="wasm">WASM (stub)</option>
        </select>
      </label>
      <button type="button" id="btnCamera">Démarrer caméra</button>
      <button type="button" id="btnLoop" disabled>Start matting loop</button>
      <button type="button" id="btnStop" disabled>Stop</button>
      <label style="flex-direction: row; align-items: center; gap: 0.5rem">
        <input type="checkbox" id="fallback" />
        Fallback (raw camera)
      </label>
      <button type="button" id="btnExport" disabled>Export JSON</button>
    </div>

    <div class="stage" id="stage">
      <canvas id="previewCanvas" width="1280" height="720"></canvas>
      <video id="rawVideo" playsinline muted autoplay></video>
      <div class="overlay" id="overlay">FPS: —</div>
    </div>
    <p class="status" id="status">Choisir résolution et caméra, puis démarrer.</p>

    <script type="module" src="./js/harness.js"></script>
  </body>
</html>
