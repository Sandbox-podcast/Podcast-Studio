# S4 POC — self-hosted MinIO on Sandbox LAN (prep; not prod).
# Pin images; configure host via .env (see .env.example). Do not commit secrets.

services:
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: podcast-s4-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-01-20T14-49-07Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/init-bucket.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-podcast-recordings-poc}
      MINIO_INTERNAL_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
      MINIO_ABORT_INCOMPLETE_MPU_DAYS: ${MINIO_ABORT_INCOMPLETE_MPU_DAYS:-7}
    volumes:
      - ./init-bucket.sh:/scripts/init-bucket.sh:ro
      - ./cors.json:/config/cors.json:ro

volumes:
  minio_data:
